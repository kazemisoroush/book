openapi: 3.1.0
info:
  title: Book local API
  version: 0.1.0
paths:
  /workflows/{name}/runs:
    post:
      summary: Start Run
      operationId: start_run_workflows__name__runs_post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Start Run Workflows  Name  Runs Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}:
    get:
      summary: Get Run
      operationId: get_run_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Run Runs  Run Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/logs:
    get:
      summary: Stream Logs
      operationId: stream_logs_runs__run_id__logs_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /books:
    get:
      summary: Get Books
      operationId: get_books_books_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksResponse'
  /books/{book_id}:
    get:
      summary: Get Book
      operationId: get_book_books__book_id__get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Book Books  Book Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /books/{book_id}/files:
    get:
      summary: Get Files
      operationId: get_files_books__book_id__files_get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Files Books  Book Id  Files Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /books/{book_id}/files/{path}:
    get:
      summary: Get File
      operationId: get_file_books__book_id__files__path__get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          title: Book Id
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /books/{book_id}/voice-assignments:
    patch:
      summary: Patch Voice Assignments
      operationId: patch_voice_assignments_books__book_id__voice_assignments_patch
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          title: Book Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Assignments
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patch Voice Assignments Books  Book Id  Voice Assignments
                  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BooksResponse:
      properties:
        books:
          items:
            type: string
          type: array
          title: Books
      type: object
      required:
      - books
      title: BooksResponse
      description: List of known book ids.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RunRequest:
      properties:
        url:
          type: string
          title: Url
        start_chapter:
          type: integer
          title: Start Chapter
          default: 1
        end_chapter:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Chapter
        refresh:
          type: boolean
          title: Refresh
          default: false
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      type: object
      required:
      - url
      title: RunRequest
      description: Body for starting a workflow run.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
