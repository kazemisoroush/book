name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run linting
        run: make lint
      - name: openapi.yaml is in sync with the API
        run: |
          PYTHONPATH=. python scripts/export_openapi.py
          git diff --exit-code openapi.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: API client is in sync with openapi.yaml
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code lib/api/schema.ts
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/out
          retention-days: 1

  infra:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/go.mod
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: web
          path: frontend/out
      - name: Build
        working-directory: infra
        run: go build ./...
      - name: Test
        working-directory: infra
        run: go test ./...
      - name: Install CDK
        run: npm install -g aws-cdk@2
      - name: Synth (cdk-nag security gate)
        working-directory: infra
        run: cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
